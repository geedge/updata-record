job:
  name: cn-detection
  active-pipeline:
    #    - console-all-indicators
    #    - console-thresholds
    #    - console-all-sequences
    #    - console-all-unordered-sequences
    - ck-all-indicators
    - ck-all-thresholds
    - ck-all-sequences
    - ck-all-unordered-sequences
    - kafka-all-indicators
    - kafka-all-thresholds
    - kafka-all-sequences
    - kafka-all-unordered-sequences

source:
  - name: session-records
    type: kafka
    option:
      topic: SESSION-RECORD-CN
      properties:
        bootstrap.servers: localhost:9092 # Config For Example
        group.id: cn-detection
    format: json
    schema:
      ## General
      - name: recv_time
        data-type: INT NOT NULL
      - name: log_id
        data-type: BIGINT NOT NULL
      - name: flags
        data-type: BIGINT
      - name: start_timestamp_ms
        data-type: BIGINT NOT NULL
      # ======= Row Time Start =======
      - name: recv_timestamp
        for: TO_TIMESTAMP_LTZ(recv_time, 0)
        watermark: recv_timestamp - INTERVAL '5' MINUTE
      # ======= Row Time End =======
      - name: end_timestamp_ms
        data-type: BIGINT NOT NULL
      - name: duration_ms
        data-type: INT NOT NULL
      - name: decoded_as
        data-type: STRING NOT NULL
      - name: client_ip
        data-type: STRING NOT NULL
      - name: server_ip
        data-type: STRING NOT NULL
      - name: client_port
        data-type: INT NOT NULL
      - name: server_port
        data-type: INT NOT NULL
      - name: app
        data-type: STRING
      - name: app_transition
        data-type: STRING
      - name: decoded_path
        data-type: STRING
      - name: ip_protocol
        data-type: STRING
      - name: l7_protocol
        data-type: STRING
      - name: out_link_id
        data-type: INT
      - name: in_link_id
        data-type: INT
      - name: subscriber_id
        data-type: STRING
      - name: imei
        data-type: STRING
      - name: imsi
        data-type: STRING
      - name: phone_number
        data-type: STRING
      - name: apn
        data-type: STRING
      ## Http Attributes
      - name: http_host
        data-type: STRING
      - name: http_url
        data-type: STRING
      - name: http_cookie
        data-type: STRING
      - name: http_referer
        data-type: STRING
      - name: http_user_agent
        data-type: STRING
      - name: http_request_line
        data-type: STRING
      - name: http_response_line
        data-type: STRING
      - name: http_status_code
        data-type: INT
      ## SSL Attributes
      - name: ssl_version
        data-type: STRING
      - name: ssl_sni
        data-type: STRING
      - name: ssl_san
        data-type: STRING
      - name: ssl_ja3_hash
        data-type: STRING
      - name: ssl_ja3s_hash
        data-type: STRING
      - name: ssl_cert_issuer
        data-type: STRING
      - name: ssl_cert_subject
        data-type: STRING
      ## DNS Attributes
      - name: dns_qr
        data-type: INT
      - name: dns_opcode
        data-type: INT
      - name: dns_aa
        data-type: INT
      - name: dns_rcode
        data-type: INT
      - name: dns_qname
        data-type: STRING
      - name: dns_qtype
        data-type: INT
      - name: dns_qclass
        data-type: INT
      - name: dns_sub
        data-type: INT
      - name: dns_rr
        data-type: STRING
      ## SSH Attributes
      - name: ssh_version
        data-type: STRING
      - name: ssh_auth_success
        data-type: STRING
      - name: ssh_client_version
        data-type: STRING
      - name: ssh_server_version
        data-type: STRING
      - name: ssh_cipher_alg
        data-type: STRING
      - name: ssh_mac_alg
        data-type: STRING
      - name: ssh_compression_alg
        data-type: STRING
      - name: ssh_kex_alg
        data-type: STRING
      - name: ssh_host_key_alg
        data-type: STRING
      - name: ssh_host_key
        data-type: STRING
      - name: ssh_hassh
        data-type: STRING
      ## Stratum Attributes
      - name: stratum_cryptocurrency
        data-type: STRING
      - name: stratum_mining_pools
        data-type: STRING
      - name: stratum_mining_program
        data-type: STRING
      - name: stratum_mining_subscribe
        data-type: STRING
      ## Knowledge
      - name: out_link_direction
        data-type: STRING
      - name: in_link_direction
        data-type: STRING
      - name: domain
        data-type: STRING
      - name: domain_sld
        data-type: STRING
      - name: domain_category_name
        data-type: STRING
      - name: domain_category_group
        data-type: STRING
      - name: domain_reputation_level
        data-type: STRING
      - name: domain_icp_company_name
        data-type: STRING
      - name: domain_whois_org
        data-type: STRING
      - name: domain_tags
        data-type: ARRAY<STRING>
      - name: client_zone
        data-type: STRING
      - name: client_country_region
        data-type: STRING
      - name: client_super_admin_area
        data-type: STRING
      - name: client_admin_area
        data-type: STRING
      - name: client_longitude
        data-type: DOUBLE
      - name: client_latitude
        data-type: DOUBLE
      - name: client_isp
        data-type: STRING
      - name: client_asn
        data-type: STRING
      - name: client_ip_tags
        data-type: ARRAY<STRING>
      - name: server_zone
        data-type: STRING
      - name: server_country_region
        data-type: STRING
      - name: server_super_admin_area
        data-type: STRING
      - name: server_admin_area
        data-type: STRING
      - name: server_longitude
        data-type: DOUBLE
      - name: server_latitude
        data-type: DOUBLE
      - name: server_isp
        data-type: STRING
      - name: server_asn
        data-type: STRING
      - name: server_ip_tags
        data-type: ARRAY<STRING>
      - name: app_category
        data-type: STRING
      - name: app_subcategory
        data-type: STRING
      - name: app_company
        data-type: STRING
      - name: app_company_category
        data-type: STRING
      - name: app_tags
        data-type: ARRAY<STRING>
      ## Metrics
      - name: subscriber_longitude
        data-type: INT
      - name: subscriber_latitude
        data-type: INT
      - name: mail_account
        data-type: INT
      - name: wx_account
        data-type: INT
      - name: device_infomation
        data-type: INT
      - name: sent_pkts
        data-type: INT
      - name: sent_bytes
        data-type: INT
      - name: received_pkts
        data-type: INT
      - name: received_bytes
        data-type: INT
      - name: sessions
        data-type: INT
      - name: tcp_c2s_lost_bytes
        data-type: INT
      - name: tcp_s2c_lost_bytes
        data-type: INT
      - name: tcp_c2s_o3_pkts
        data-type: INT
      - name: tcp_s2c_o3_pkts
        data-type: INT
      - name: tcp_c2s_rtx_bytes
        data-type: INT
      - name: tcp_s2c_rtx_bytes
        data-type: INT
      - name: tcp_c2s_rtx_pkts
        data-type: INT
      - name: tcp_s2c_rtx_pkts
        data-type: INT
      - name: tcp_rtt_ms
        data-type: INT
      - name: http_response_latency_ms
        data-type: INT
      - name: ssl_handshake_latency_ms
        data-type: INT
      - name: dns_response_latency_ms
        data-type: INT


sink:
  ## Console Debug
  - name: console-all-indicators
    type: console
    based-on: all-indicators
    format: json
  - name: console-thresholds
    type: console
    based-on: all-thresholds
    format: json
  - name: console-all-sequences
    type: console
    based-on: all-sequences
    format: json
  - name: console-all-unordered-sequences
    type: console
    based-on: all-unordered-sequences
    format: json
  ## Clickhouse Sink
  - name: ck-all-indicators
    based-on: all-indicators
    type: clickhouse
    option:
      host: localhost:9001 # Config For Example
      table: cyber_narrator_galaxy.match_indicator
      connection:
        user: default
        password: galaxy2019
  - name: ck-all-thresholds
    based-on: all-thresholds
    type: clickhouse
    option:
      host: localhost:9001 # Config For Example
      table: cyber_narrator_galaxy.match_threshold
      connection:
        user: default
        password: galaxy2019
  - name: ck-all-sequences
    based-on: all-sequences
    type: clickhouse
    option:
      host: localhost:9001 # Config For Example
      table: cyber_narrator_galaxy.match_sequence
      connection:
        user: default
        password: galaxy2019
  - name: ck-all-unordered-sequences
    based-on: all-unordered-sequences
    type: clickhouse
    option:
      host: localhost:9001 # Config For Example
      table: cyber_narrator_galaxy.match_unordered_sequence
      connection:
        user: default
        password: galaxy2019
  ## Kafka Sink
  - name: kafka-all-indicators
    type: kafka
    based-on: all-indicators
    option:
      topic: MATCH_INDICATOR
      properties:
        bootstrap.servers: localhost:9092 # Config For Example
      partitioner: client_ip, server_ip, indicator_fields, indicator_values
    format: json
  - name: kafka-all-thresholds
    based-on: all-thresholds
    type: kafka
    option:
      topic: MATCH_THRESHOLD
      properties:
        bootstrap.servers: localhost:9092 # Config For Example
      partitioner: key_fields, key_values
  - name: kafka-all-sequences
    based-on: all-sequences
    type: kafka
    option:
      topic: MATCH_SEQUENCE
      properties:
        bootstrap.servers: localhost:9092 # Config For Example
      partitioner: key_fields, key_values
  - name: kafka-all-unordered-sequences
    based-on: all-unordered-sequences
    type: kafka
    option:
      topic: MATCH_UNORDERED_SEQUENCE
      properties:
        bootstrap.servers: localhost:9092 # Config For Example
      partitioner: key_fields, key_values

pipeline:
  - name: alert
    category: MULTI-RULE
    based-on: session-records
    rule:
      - name: '100001'
        type: CONDITION
        when: ARRAY_CONTAINS_IGNORE_CASE(server_ip_tags, 'Tor') || ARRAY_CONTAINS_IGNORE_CASE(domain_tags, 'Tor')
      - name: '100005'
        type: CONDITION
