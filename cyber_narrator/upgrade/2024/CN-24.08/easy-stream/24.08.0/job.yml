      ## Threshold
      - name: '200001'
        type: AGGREGATE
        when: decoded_as == 'HTTP' && http_host.isNotNull
        group-by: http_host
        aggregate: COUNT(1) as cnt, SUM( IF( http_status_code >= 400 AND http_status_code <= 599, 1, 0 ) ) as error_cnt, MAX(recv_time) as end_time, MIN(recv_time) as start_time
        having: error_cnt / cnt > 0.1
        with-in: 5 minute
        slide-step: 1 minute
      - name: '200002'
        type: AGGREGATE
        when: decoded_as == 'DNS' && dns_qname.isNotNull
        group-by: dns_qname
        aggregate: COUNT(1) as cnt, SUM( IF( dns_rcode <> 0, 1, 0 ) ) as error_cnt, MAX(recv_time) as end_time, MIN(recv_time) as start_time
        having: error_cnt / cnt > 0.1
        with-in: 5 minute
        slide-step: 1 minute
      - name: '200003'
        type: AGGREGATE
        when: decoded_as == 'SSH' && server_ip.isNotNull
        group-by: server_ip
        aggregate: COUNT(1) as cnt, MAX(recv_time) as end_time, MIN(recv_time) as start_time
        having: cnt > 10
        with-in: 1 minute
        slide-step: 1 minute
      - name: '200004'
        type: AGGREGATE
        when: decoded_as == 'HTTP' && http_host.isNotNull
        group-by: http_host
        aggregate: COUNT(1) as cnt, SUM(http_response_latency_ms) as latency_sum, MAX(recv_time) as end_time, MIN(recv_time) as start_time
        having: latency_sum / cnt > 500
        with-in: 5 minute
        slide-step: 1 minute
      - name: '200005'
        type: AGGREGATE
        when: decoded_as == 'DNS' && dns_qname.isNotNull
        group-by: dns_qname
        aggregate: COUNT(1) as cnt, SUM(dns_response_latency_ms) as latency_sum, MAX(recv_time) as end_time, MIN(recv_time) as start_time
        having: latency_sum / cnt > 500
        with-in: 5 minute
        slide-step: 1 minute
      ## Sequence
      - name: '300001'
        type: CEP
        mode: RELAXED
        group-by: client_ip
        order-by: recv_timestamp
        measures:
          - A.recv_time AS start_time
          - B.recv_time AS end_time
          - A.recv_time AS a_recv_time
          - A.client_ip AS a_client_ip
          - A.domain AS a_domain
          ## B
          - B.recv_time AS b_recv_time
          - B.client_ip AS b_client_ip
          - B.server_ip AS b_server_ip
          - B.app_transition AS b_app_transition
        pattern: A B
