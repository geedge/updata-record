    category: MAP
    select: >
      SNOWFLAKE_ID() AS match_id, '200005' AS rule_id, '1' AS rule_version, 'threshold' AS rule_type, 1 AS is_builtin,
      'Performance Events.DNS Error' AS event_type, 'High DNS Response Latency' AS event_name, 'dns_qname' AS key_fields, dns_qname AS key_values, 
      ( (latency_sum / cnt) >= 1500 ).?( 1500.0, ( (latency_sum / cnt) >= 1000 ).?( 1000.0, 500.0 ) ) AS threshold_value, 
      ( (latency_sum / cnt) >= 1500 ).?( 4, ( (latency_sum / cnt) >= 1000 ).?( 3, 2 ) ) AS severity, 
      CAST( (latency_sum / cnt), DOUBLE) AS metric_value, 3 AS unit, 20 AS reset, start_time, end_time
  ## Sequence
  - name: '300001'
    based-on: 'alert.300001'
    category: MAP
    select: >
      SNOWFLAKE_ID() AS match_id, '300001' AS rule_id, '1' AS rule_version, 'cep' AS rule_type, 1 AS is_builtin,
      'Regulatory Risk' AS event_type, 'TunnelBear VPN Connection' AS event_name, 3 AS severity,
      'client_ip' AS key_fields, client_ip AS key_values, start_time, end_time,
      '[' + JSON_OBJECT('stage_id', 'A', 'recv_time', a_recv_time, 'client_ip', a_client_ip, 'domain', a_domain ) + ', ' +
      JSON_OBJECT('stage_id', 'B', 'recv_time', b_recv_time,
         'client_ip', b_client_ip, 'server_ip', b_server_ip, 'app_transition', b_app_transition ) + ']'
      AS event_info

  ## Unordered Sequence
  - name: '400001'
    based-on: 'alert.400001'
    category: MAP
    select: >
      SNOWFLAKE_ID() AS match_id, '400001' AS rule_id, '1' AS rule_version, 'occur_all' AS rule_type, 1 AS is_builtin,
      'Regulatory Risk' AS event_type, 'Hotspot Shield VPN Connection' AS event_name, 3 AS severity, 
      'client_ip' AS key_fields, __0.get('client_ip') AS key_values, 
      '[' + JSON_OBJECT('stage_id', 'A', 'recv_time', __0.get('recv_time'), 
           'client_ip', __0.get('client_ip'), 'domain', __0.get('domain') ) + ', ' +
        JSON_OBJECT('stage_id', 'B', 'recv_time', __1.get('recv_time'), 
           'client_ip', __1.get('client_ip'), 'server_ip', __1.get('server_ip'), 
      'domain', __1.get('domain') ) + ']' AS event_info, 
      (__0.get('recv_time') < __1.get('recv_time')).?(__0.get('recv_time'), __1.get('recv_time')) AS start_time, 
      (__0.get('recv_time') > __1.get('recv_time')).?(__0.get('recv_time'), __1.get('recv_time')) AS end_time

