version: '3.3'

services:
  node_exporter:
    image: node-exporter:1.2.2
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/prom'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
      - '/home/tmp/prom:/prom'
