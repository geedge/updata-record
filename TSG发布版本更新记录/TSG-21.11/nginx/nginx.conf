worker_processes  auto;
 
events {
    worker_connections  4096;
}
 
http {
 
    include  mime.types;
    default_type  application/octet-stream;
    sendfile  on;
    keepalive_timeout  65;
    vhost_traffic_status_zone;
    vhost_traffic_status_filter_by_host on;
    client_max_body_size 1024M;  #(设置客户端请求体最大值)
    client_body_buffer_size 128k;  #(配置请求体缓存区大小,)
    access_log off; # 关闭access日志

    upstream hos {
        server {{ machine_host }}:8186;
        keepalive 1000;
        keepalive_timeout  65;
        keepalive_requests 100000;
    }
    geo $islocalip {
        default 0;
        {{ allowed_host }}.0/24 1; #添加本地不需要加密的ip，支持掩码形式，格式为xxx.xxx.xxx.xxx 1;
    }
    #hos非加密
    server {
        listen 9098;
        server_name localhost;
        client_max_body_size 1024m;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            set $ssl 0; #是否开启重定向加密，开启是1，关闭是0，默认关闭
            if ($islocalip = 0){
                set $ssl "${ssl}1";
            }
            if ($request_method = GET) {
                set $ssl "${ssl}1";
            }
            if ($ssl = "111") {
                return 302 https://$host:9097$request_uri;
            }
            proxy_pass http://hos$request_uri;
        }
    }

    #hos加密
    server {
        listen 9097 ssl;
        server_name localhost;
        proxy_set_header Host $host:9098;
        client_max_body_size 1024m;
        ssl_certificate /usr/local/nginx/conf/self-sign.crt;
        ssl_certificate_key /usr/local/nginx/conf/self-sign.key;
        location / {
            proxy_pass http://hos;
        }
    }
}

